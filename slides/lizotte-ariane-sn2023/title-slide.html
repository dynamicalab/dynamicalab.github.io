<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
  <p class="author">$author$</p>
$endfor$
$for(institute)$
  <p class="institute">$institute$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
<table class="logo-container absolute" style="bottom=0%">
  <tr>
    <td class="logo">
        <img src="logos/drac.png">
    </td>
    <td class="logo">
        <img src="logos/logo-frqnt-couleur.png">
    </td>
    <td class="logo">
        <img src="logos/logo_sn_fr.svg">
    </td>
    <td class="logo">
        <img src="logos/ul.svg">
    </td>
    <td class="logo">
        <img src="logos/dynamica.svg">
    </td>
  </tr>
</table>
</section>
