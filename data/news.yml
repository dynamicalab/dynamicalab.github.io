- date: 2018-03-19
  text: |-
    It seems that three is the magic number : a third contribution from the Networks section has been published in the latest issue of Physical Review E.


     The paper entitled "Geometric evolution of complex networks with degree correlations" presents a novel model for network growth. The structure evolves in a metric space, and new nodes create links with existing ones with a probability that is a function of both, time and distance between the nodes.
    This growth model allows to reproduce many features of real world networks,
    such as the clustering (triadic closure) and the degree-degree correlations.


     Links to the full text and preprints are available on the Publication page.

- date: 2018-03-03
  text: |-
    The latest contribution of the Networks section is available in the March issue of Physical Review E.


     The paper entitled "Exact analytical solution of irreversible binary dynamics on networks" presents a set of recursive equations to solve exactly a binary cascade dynamics on networks. An algorithm built around a breath-first search procedure is introduced to accelerate the calculation, leading to an exponential time worst-case complexity instead of a factorial one.


     Links to the full text, preprints and software are available on the Publication page.

- date: 2018-02-12
  text: |-
    The latest contribution of the Networks section is available in the February issue of Physical Review E.


     The paper entitled "Phase transition of the susceptible-infected-susceptible dynamics on time-varying configuration model networks" revisits the critical phenomenon of the SIS model on time-varying networks, a standard prototype for the study of epidemic outbreaks. The contribution introduces a new theoretical framework that accurately describes the phase transition for a wide range of structures and provides a comprehensive study of the impact of networks evolution through the use of a rewiring mechanism.


     Links to the full text and preprints are also available on the Publication page.

