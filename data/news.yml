- date: 2016-05-29
  text: |-
    Three members from the network section will represent Dynamica at NetSci this year.


     The conference will be held in Seoul from May 30 to June 3, at the K-Hotel conference center.




     Charles Murphy will present his latest results on spatial networks in a talk entitled "Time-Dependent Spatial Growth of Complex Networks". The talk is scheduled on Thursday, June 2 at 11:55. He will introduce a new class of growth processes for spatial networks, where connection probabilities depend both on distance and time. Among other things, Charles will show that the model is analytically tractable, and that one can obtain scale-free spatial networks for particular values of the parameters.


     Guillaume St-Onge will present a poster entitled "Co-evolution of Growth and Dynamics on Network".Posters will be displayed for two days, from Wednesday to Thursday, and a poster session will be held on Wednesday night. This should leave ample opportunity to read the poster and discuss with Guillaume. In his poster, Guillaume presents a novel growth process for complex networks, in which growth mechanisms are restrained to certain subsets of nodes. This set of nodes changes dynamically through time. He shows that this growth process can lead, for instance, to preferential attachment.




     Finally, I will present my latest work on the Stochastic Block Model in a satellite session, on Thursday (Statistical Inference for Networks Model), as well as in a lightning talk on Friday. I will discuss the detectability limit,
    and its analog in the finite size regime. Among other things, I will present a statistical explanation of the limit (independent from any algorithms), and approximation methods to compute the boundaries of the undetectable region. I will also connect graph transformations to the symmetries of the undetectable region.




     Head over to the publication page to see the abstracts of each contribution in full.

- date: 2016-05-21
  text: |-
    Jean-Luc Déziel will present his latest work on self-organized plasma formation at Photonics North 2016, in Québec, Canada.


     In his talk, Jean-Luc will show how to incorporate extreme non-linear optics into particle in cell simulations of the interaction between light and matter.
    He will argue that the resulting numerical framework is ideal to study self-
    organized plasma formation.


     As always, head over to the publication page to read the abstract.

- date: 2016-05-07
  text: |-
    Yours truly (Jean-Gabriel Young) will represent Dynamica at the summer school
    "Complex networks: theory, methods, and applications (2nd ed.)".

     The school, which will takes place at the beautiful Villa Grumello in Lake Como Italy, will regroup over 50 participants from all over the world.


     Speakers will discuss important topics such as unconventional network analysis methods, spatial and temporal networks, principled community detection,
    connectomics, and more.

- date: 2016-04-11
  text: |-
    As is now tradition, Dynamica will hold two Colloquia at the end of the winter semester.


     On Monday, April 11th, Edward Laurence will present his master thesis,
    entitled " _Étude des systèmes complexes, des réseaux au_ _connectome du cerveau"._ He will discuss network growth and dynamics in the context of connectomics.


     On Wednesday, April 13th, Jean-Luc Déziel will pass his doctoral preparation exam. For this occasion, he prepared a presentation entitled " _Simulation d'interaction intenses entre matière et rayonnement"_. Jean-Luc will discuss the numerical processes that go into modelling interactions between light and matter, at high energy levels.


     We wish them both the best of luck!

- date: 2016-03-16
  text: |-
    Back in December, our group leader, Pr. Louis J. Dubé, received the 2015
    Excellence Award in Teaching, in the "Outstanding Graduate Faculty Mentor"
    category.

     The publicity department of Université Laval just released short videos presenting the laureates (in French).


     The relevant video can be found on the official page of the awards or directly on YouTube.


     Congratulation!

- date: 2016-03-08
  text: |-
    We are happy to announce that the latest contribution of the networks division, entitled " _Constrained growth of complex scale-independent systems_
    ", is now featured in the highlights of Physical Review E for its 'particular interest, importance, [and] clarity'.


     One of the perks that comes with the recognition is a crystal clear summary of our work. which reads as follows


      _Scale-free distributions of resources arise in very diverse systems, such as in the distribution of wealth or of the population of cities. By coupling the overall population growth with the individual growth in resources, the authors propose a model describing the emergence of such behavior. Through this model,
    the authors introduce a method to reconstruct the past or forecast the future from a snapshot of data._


     The full text is available on the Publications page.

- date: 2016-02-02
  text: |-
    _
    _The most recent contribution of the photonics division, " _Constructive feedback for the growth of laser-induced periodic surface structures_ ", has been published Phys. Status Solidi C.   In the paper, we study the formation and growth of laser-induced periodic surface structures (LIPSSs) with the finite-difference time-domain method.   We introduce a novel feedback mechanism which not only explains why
    "classical" (type-s) LIPSSs appear on materials with dielectric and metallic optical properties, but also why type-d structures are observed on metallic materials. _
    _The full text is available on thePublications page.

- date: 2016-01-13
  text: |-
    A figure from our recent paper " _Complex networks as an emerging property of hierarchical preferential attachment_ " has been selected to appear in the January Kaleidoscope of Physical Review E. Figures are selected on aesthetic merit.


     Congratulations to our local artist, Edward Laurence!


     For the record, the figure was produced with D3.js, a Java library for data visualization.

- date: 2015-12-10
  text: |-
    The latest contributions of the Networks section are now available in the December issue of Physical Review E.


     In the first paper, entitled "Complex networks as an emerging property of hierarchical preferential attachment", we introduce an unifying principle that explains many real-world properties of complex networks, such as scale independence, clustering, fractality, and navigability.


     It builds upon simple models such as the Structural Preferential Attachment
    (SPA) principle, and the classical PA model of Barabási and Albert.


     In the second contribution, entitled "General and exact approach to percolation on random graphs", we proposes a comprehensive and versatile theoretical framework to study site, bond and hybrid percolation on clustered and correlated random graphs.


     It encompasses most of the models published to this day as special cases, and will help model structural properties not yet considered in the literature.


     The full texts are available on the Publications page.

- date: 2015-12-04
  text: Jean-Gabriel Young has successfully completed his doctoral exam (with an unanimous excellent overall rating from the 4 examiners). This is the first official and major compulsory step towards his Ph. D. Congratulations are in order and celebrations are soon to come …

- date: 2015-11-12
  text: |-
    It is with great pride that we announce that our group leader, Pr. Louis J. Dubé, has received the 2015 Excellence Award in Teaching, in the "Outstanding Graduate Faculty Mentor" category. The distinction is awarded to professors that foster an outstanding research and learning environment throughout their career. Pr. Louis J. Dubé brings the best out of every student, and, through invested mentorship, turns them in independent thinkers and researchers.
    Thanks to the emphasis that he puts on communication and camaradrie, Dynamica is a tightly knit group of students akin to a family. Needless to say that the prize is well deserved, as no less than 15 members graduated from Dynamica in the past 10 years, and now pursue fulfilling academic and industrial careers.


     Congratulations on behalf of the current and past members of Dynamica.

- date: 2015-10-16
  text: |-
    After careful examination, the evaluation committee has given the highest overall mark (excellent) to the Master thesis of Jean-Luc Déziel. Therefore,
    the name of the author will be added to the Tableau d’Honneur of the Faculté
    des Etudes Supérieures et Post-doctorales (Graduate School). It perpetuates the group's tradition of excellence, with 7 theses added to the Board of Honour in 7 years. Congratulations are in order.




     The thesis can be found here.

- date: 2015-10-13
  text: |-
    The latest contribution of the networks section, titled " _A Shadowing Problem in the Detection of Overlapping Communities: Lifting the Resolution Limit through a Cascading Procedure_ " has just been published on the PLoS ONE website. In the paper, we show that a large class of overlapping community detection algorithm suffers from a new kind of resolution problem called shadowing. A simple meta-algorithm that circumvents the problem is proposed.
    The full text is available on the publisher website (open access), and the software can be downloaded from github.

- date: 2015-10-01
  text: |-
    A new member, Charles Murphy, has now officially joined Dynamica. This brings the network section to a combined force of 4 students. After he completes the Trial by Fire (an introductory marathon to nonlinear dynamics, network science and statistical physics), Morphée (his current nickname, waiting approval …)
    will set on an investigation of the connectome, from a network point of view.

- date: 2015-07-14
  text: |-
    The Photonics section strikes again. A tutorial/review entitled _Lorenz-Mie theory for 2D scattering and resonance calculations_ has just been accepted for publication in J. Opt. The PhD tutorial is based on the thesis work of Dr.
    Denis Gagnon. It is concerned with a description of the two-dimensional generalized Lorenz-Mie theory (2D-GLMT), a well-established numerical method used to compute the interaction of light with arrays of cylindrical scatterers. This theory is based on the method of separation of variables and the application of an addition theorem for cylindrical functions. The purpose of this tutorial is to assemble the practical tools necessary to implement the
    2D-GLMT method for the computation of scattering by passive scatterers or of resonances in optically active media. The first part contains a derivation of the vector and scalar Helmholtz equations for 2D geometries, starting from Maxwell's equations. Optically active media are included in 2D-GLMT using a recent stationary formulation of the Maxwell-Bloch equations called steady-
    state ab initio laser theory (SALT), which introduces new classes of solutions useful for resonance computations. Following these preliminaries, a detailed description of 2D-GLMT is presented. The emphasis is placed on the derivation of beam-shape coefficients for scattering computations, as well as the computation of resonant modes using a combination of 2D-GLMT and SALT. The final section contains several numerical examples illustrating the full potential of 2D-GLMT for scattering and resonance computations. These examples, drawn from the literature, include the design of integrated polarization filters and the computation of optical modes of photonic crystal cavities and random lasers.

- date: 2015-07-06
  text: ''

- date: 2015-05-11
  text: |-
    We are happy to announce the arrival of a new member, Guillaume St-Onge, to the brotherhood. While finishing his last course works for his B.Sc., and cumulating the load of a summer research student (NSERC fellowship), STO (his obvious (!) acronym) is learning the tricks of the trade in the Network Section. He has not yet passed the necessary test of our 100 kms+ bike outing,
    but we are confident in his abilities. He is most welcome (until further notice) and we have set for him the investigation of Adaptive Networks started some time ago by Vincent Marceau.

- date: 2015-04-22
  text: |-
    The _eleventh_ edition of the Symposium Dynamica will take place on April 30th at the beautiful Forêt Montmorency. This pedagogical activity is held as part of the Non-linear dynamics, Chaos and Complexity course. The second half of the semester is dedicated to team projects on selected subjects ranging from KAM theorem to Markov chain analysis of musical compositions. During the Symposium, each team must present their work to a jury composed of their peers and of the members of the research group. The program of the day is available here (in french).


     We will have the honour to have Patrick Desrosiers as our distinguished guest.

- date: 2015-04-13
  text: |-
    Jean-Luc Déziel will hold his Master's colloquia on April 17th. He will expose his latest work, " _Ablation laser et croissance de réseaux de surfaces_ ", on theoretical and numerical models of Laser Induced Periodic Surfaces.


     We wish him the best of luck!


     For more information, see the attached notice (in French).

- date: 2015-04-10
  text: |-
    Members of Dynamica will travel both close and far to 3 important Conferences this summer: Edward Laurence, Jean-Gabriel Young and LJD will attend the 2015
    edition of the NetSci International School and Conference on Network Science in Zaragosa, Spain at the beginning of June, whereas Jean-Luc Déziel will take part in 2 conferences  closer to home base: EXCON 2015 in Montreal, and Photonic North in Ottawa,. The abstracts of the research to be presented can be seen here.

- date: 2015-03-17
  text: |-
    Dynamica addresses anew its warm welcome to Professor Reinhold Blümel,
    specialist of quantum chaos and the exact solution of "unsolvable" problems,
    among other things. During his stay, Prof. Blümel will be giving a talk entitled "Introduction to Quantum Chaos: An Unconventional Perspective”.

- date: 2015-02-18
  text: |-
    Jean-Gabriel YOUNG has been selected to attend the 2015 edition of the Complex Systems Summer School organized by the Santa Fe Institute. The summer school will be held in Santa Fe, NM from June 7 to July 3. Congratulations are in order. Here is an excerpt from the letter of acceptance highlighting the importance of the honour bestowed upon another member of the group (after Antoine Allard in 2011 and Laurent Hébert-Dufresne in 2012) :

    “ … Out of more than 300 students (about 5 applicants for each seat) you have been selected based on your academic credentials, eclectic research agenda,
    and evidence of transdisciplinary interests.


     Selected participants come from all over the world and represent a wide range of disciplines. The Institute’s CSSS is our flagship educational program, now twenty-five years old. Many of our alumni tell us that participation in the program has had a major, sustained impact on their academic and professional careers, including membership in a research network of outstanding collaborators at the cutting edge of science.”

- date: 2014-12-15
  text: |-
    It is with great pride that we announce that Denis Gagnon (DeGa) has successfully defended his thesis entitled "Generalized Lorenz-Mie Theory:
    Applications to scattering and resonances of photonic complexes” and has therefore been awarded the title of Philosophiae Doctor (Ph. D.).


     The thesis and the oral presentation have left a strong impression on the examiners. Rigour in the treatment of the models and novelty in the combination of methods (from scattering and resonance calculations to optimisation in photonics) were hailed as the highest standard to reach by all present. Besides the 4 publications that form the core of the thesis, a further success is to note, a special editorial invitation by the Journal of Optics (IOP) to produce a tutorial review of his thesis work.


     The final version of his thesis is available from the theses page.


     DeGa will join early in February 2015 the group of Steve Maclean at INRS Varennes (Energie-Matériaux-Télécommunications) for his post-doctoral research.

- date: 2014-11-18
  text: |-
    Postdoctoral fellow Dr. Sergey Melnik will be visiting snowy Quebec City between the 17th and 22nd of November.


     While his recent research focus mostly on spreading process on networks, he also has a keen interest for the dynamics of semiconductor laser, a subject that is close to the interest of our photonics section.


     During his stay, Dr. Melnik will be giving a talk entitled "Modeling the structure and dynamics of complex networks".

- date: 2014-09-30
  text: |-
    It is with great pride that we announce that Laurent Hébert-Dufresne (LSD) has successfully defended his thesis entitled "On the Growth and Structure of Social Systems Following Preferential Attachment" and has therefore been awarded the title of Philosophiae Doctor (Ph. D.).


     There is no doubt that LSD belongs to this group of exceptional young researchers that will permeate the field of complex systems for the years to come. He has demonstrated time and time again his ability to move from ideas
    (or germs of) to a workable model and his impressive list of publications bears testimony to this statement.


     The final version of his thesis will be available from the theses page in the very near future.


     Dr. Hébert-Dufresne is now pursuing his research as a James S. McDonnell Foundation Post-doctoral Fellow at the Santa-Fe Institute, New Mexico.

- date: 2014-09-11
  text: |-
    Members of the network division authored a chapter in the recently published book "Mathematical Modelling of Zombies".


     In this tongue-in-cheek presentation, they showcase the tools of adaptive


     network theory by predicting the outcome of a Zombie apocalypse.


     You can download the chapter from our website. The complete book is now available on Amazon.

- date: 2014-09-08
  text: The latest contribution of the Photonics section, entitled _Optimization of integrated polarization filters_ , will be published in the October issue of Optics Letters. In this crisp Letter, we present the design of integrated optical devices suited for the dual purpose of beam shaping and logical polarization filtering. The full text is available here. See the Publications page for more details

- date: 2014-09-08
  text: |-
    It is with pride that we announce that Joey Dumont and Jean-Gabriel Young have submitted for evaluation their master’s theses entitled "On the Modelization of Optical Devices: From Dielectric Cavities to Radiating Structures" and « De la Détection de la Structure Communautaire des Réseaux Complexes » (On the Detection of Community Structure in complex Systems) respectively. The full text of the research will soon be available from the Theses section of this site.


     Joey Dumont is pursuing his graduate studies in light-matter interactions at INRS-ÉMT, while Jean-Gabriel Young has decided to remain in the fold a bit longer to continue his doctoral research.

- date: 2014-08-01
  text: |-
    Last July, the latest research of our group was presented by L. J. Dubé at the
    16th International Conference on Transparent Optical Networks in Graz,
    Austria. The proceedings of the invited talk, titled _Adding SALT to Coupled Microcavities: the making of active photonic molecule lasers,_ is available from the Conferences section of this site.

- date: 2014-07-03
  text: |-
    Last month, our Network division went to Berkeley, California to take part in the 9th International School and Conference on Network Science. Jean-Gabriel Young and Laurent Hébert-Dufresne presented their lastest work.


     The poster entitled "Complex networks are an emerging property of hierarchical preferential attachment" was one of the five posters, out of the 150+, to be awarded the Outstanding Poster Award. You can take a look at it in Publications section.

- date: 2014-06-23
  text: The latest contribution of the Photonics section, entitled _Ab initio investigation of lasing thresholds in photonic molecules_ , will be published in the August issue of J. Opt. Soc. Am B. In it, Denis Gagnon studies the lasing thresholds of photonic molecules by using the recently developed steady-state _ab initio_ laser theory (SALT). The full text is available on the Publications page.

- date: 2014-04-25
  text: |-
    April 24th saw the second edition of our now traditional Symposium Numerica, a pedagogical activity held as part of the Numerical Physics course. Near the end of the semester, students are given a project and are tasked with making the most out of their nascent numerical skills. During the Symposium, each team must present their work to a jury composed of their peers and of the members of the research group. The program of the day is available here.


     This year, we had the honour to have Daniel Côté and Philippe Després as our distinguished guests.

- date: 2014-04-25
  text: |-
    It is with great pride that we announce that Antoine Allard has successfully defended his thesis entitled "Percolation sur graphes aléatoires –
    modélisation et description analytique" (Percolation on Random Graphs –
    modeling and analytic description), and has therefore been awarded the title of Philosophiae Doctor (Ph. D.).


     After careful study of his thesis, the four examiners have been unanimous in granting the highest overall mark–excellent in all counts. Dr. Allard's name will soon be added to the Tableau d’Honneur (Board of Honour) of the Faculté
    des Études Supérieures et Post-doctorales (Graduate School). The final version of his thesis will be available from the theses page in the very near future.


     It has been a pleasure to discover the world of Network Science with Antoine,
    one of the first two collaborators with Dr. Pierre-André Noël in our Networks Section. His talents have matured over the years and his scientific contributions have always been inspired by a sense of rigour and a search for generality. His thesis is a vibrant testimony of the depth and breadth of his work. We wish him continuing success in his research in tune with his undeniable scientific (and human) qualities.


     Dr. Allard will soon be pursuing his research as a Postdoctoral Scholar in Prof. Marian Boguna’s group at the Universitat de Barcelona, Spain.

- date: 2014-04-04
  text: |-
    It is a pleasure to announce that Jean-Gabriel Young and myself, Joey Dumont,
    have held our Master's colloquia. The former brilliantly exposed his latest work, _On the Detection of the Community Structure of Complex Networks_ ,
    wherein he discussed a generalized theoretical framework for the study of community detection algorithms. For more information, see the attached notice
    (in French).


     As for myself, I discussed the modelization of optical devices with the use of scattering methods and applied these methods to the study of bidimensional microcavities and of radiating structures. Once again, more details can be found in the notice (also in French).


     Here at Université Laval, a Master's colloquium is a rather informal event where the graduate student publicly presents his or her work before a panel of judges. Because this occurs before the thesis is shown to the judges (or even written), their task is not to evaluate the student, but to provide him or her with some last advice before the conclusion of his/her graduate work. These colloquia thus represent the beginning of the end for Mr. Young and I.

- date: 2014-04-04
  text: |-
    The Networks division will once again be participating to the NetSci conference. During the 9th edition of the international conference, Jean-
    Gabriel Young will be giving a talk entitled _Structural preferential attachment of community structure and its relation to Dunbar’s number_ ,
    chosen amongst 310 contributions. Our other emissary will be Laurent Hébert-
    Dufresne. He shall reveal how _Complex networks are an emerging property of hierarchical preferential attachment_ in a poster presentation.


     Held in Berkeley, California this year, the meeting will provide us the opportunity to be, if only briefly, reunited with our former member, Dr.
    Pierre-André Noël, who is on the program committee of this year's edition.

- date: 2014-02-10
  text: |-
    _Physical Review E_ has recently announced that they will be marking a small numbers of articles with a seal reserved for papers 'of particular interest,
    importance, or clarity.'


     On that note, we wish to announce that _Coexistence of phases and the observability of random graphs_ has been published in PRE and has been chosen as an Editors' Suggestion. We congratulate Antoine Allard (and his co-authors)
    for this fine work and hope this paper will receive the attention it deserves.
    __

- date: 2014-01-29
  text: |-
    The senior member of our research group, Antoine Allard, has been nominated for a merit award by the local student association for his work as a TA. It seems our budding physicist has grown to become a capable educator.


     This nomination follows from his Fall 2013 stint as TA for the Statistical Physics course.

- date: 2014-01-21
  text: |-
    It is with great pride that we announce that Guillaume Painchaud-April has successfully defended his thesis entitled " **Dielectric cavities: Scattering formalism and applications** " and has therefore been awarded the title of Philosophiae Doctor (Ph. D.). The event took place on the 11th of December
    2013 as mentioned in previous news.


     The final version of his thesis is now available from the theses page.


     During his time in the group, Dr. Painchaud-April has been the rock upon which we all, at one time or another, reached for support. He has developed into a thorough and careful analyst unafraid to tackle the most daunting difficulties. His thesis is a testimony of his skill and his thoughtful insights. We wish him well for his future endeavours.


     Dr. Painchaud-April is continuing his career as a NDT Specialist in the Solutions and Technologies Group of Olympus NDT Canada (www.olympus-IMS.com).

- date: 2013-12-10
  text: On November 29th, 2013, Denis Gagnon met with his doctoral committee to present the work he performed in the last year. Almost a year to the day after his doctoral exam, this oral presentation allows the advisors to follow-up on the progress of the doctoral candidate. Needless to say, D.G. delivered an excellent seminar.

- date: 2013-12-10
  text: 'The continued effort of our Networks division has borne fruit once again. Two new papers, _Epidemics on contact networks: a general stochastic approach_ by Dr. Pierre-André Noël is to appear in _J. Math. Bio._ while _Percolation on random networks with arbitrary k-core structure_ by Laurent Hébert-Dufresne and Antoine Allard was accepted to be published Phys. Rev. E. We heartily congratulate the authors for their work!'

- date: 2013-12-10
  text: |-
    Tomorrow, on December 11th, Guillaume Painchaud-April will be defending his thesis. Entitled _Dielectric Cavities: Scattering formalism and applications_
    , it is the apotheosis of years of hard work. We wish him the best of luck.

- date: 2013-12-10
  text: |-
    Dynamica bids a warm welcome to Professor Reinhold Blümel, specialist of ion trapping, quantum chaos and the exact solution of "unsolvable" problems.
    During his stay in snowy Quebec City, Prof. Blümel will be giving talk entitled "Code Breaking with Quantum Computers".


     He is also on Guillaume Painchaud-April's advising committee and will act as an external advisor for his thesis defence.

- date: 2013-10-21
  text: |-
    Laurent Hébert-Dufresne (LSD) is one of the 10 recipients of this year 2013
    JSMF Fellowships. The post-doctoral award comes with a small (!) stipend at the level of $200 000 US for 2 years. We congratulate LSD for this remarkable achievement and are proud to salute the collaborative spirit and work of the Network section of Dynamica that helped make the application for the Fellowship a outstanding success. The title of the research to be pursued under the Fellowships reads:« Co-evolution dynamics : from disease spread and resource distribution in human systems to biological and cultural evolution ».
    Is there more to say?

- date: 2013-07-11
  text: |-
    A new paper entitled _Global Efficiency of Local Immunization on Complex Networks_ , has been published by our Networks division. To appear in
    _Scientic Reports_ , it deals with the importance of local measures to properly identify influential spreaders in a complex network.


     More information can be found on our Publications page.

- date: 2013-06-19
  text: A new paper, penned by Denis Gagnon, is set to appear in the July issue of Opt. Lett. Both the arXiv preprint and the full text are available from the Publications page.

- date: 2013-05-15
  text: 'Copenhagen, capital city of Denmark, will be host to the 8th International School and Conference on Network Science, or NetSci 2013. Our Networks division will be contributing a talk and two poster presentations. Laurent Hébert-Dufresne will be giving a talk entitled _Hard-core random networks as an effective model of bond percolation on real networks_. Antoine Allard''s poster is _Bond and site percolation on clustered and correlated random graphs_. Finally, Jean-Gabriel Young will be presenting _Local and global solutions to community detection: when resolution matters_. More information can be found on the Conferences section of this site. ****'

- date: 2013-05-13
  text: |-
    In the latter part of the month of June, Joey Dumont and Denis Gagnon will present their latest research at the 15th International Conference on Transparent Optical Networks. Their respective oral presentations, _S and Q Matrices Reloaded: applications to open, inhomogeneous and complex cavities_
    and _Coherent beam shaping using two-dimensional photonic crystals_ will be part of the Special session on Photonic Atoms  & Molecules. The conference proceedings and copies of the talks will be available from the Conferences section of this site.

- date: 2013-05-13
  text: |-
    A member of our Photonics division, Denis Gagnon, will be contributing to the
    44th Annual DAMOP Meeting in the form of a poster presentation entitled
    _Optimization in optical systems revisited: Beyond genetic algorithms_. An abstract and the poster are available from the Conferences section of the site. __

- date: 2013-03-05
  text: |-
    While at the Complex Systems Summer School (Santa Fe Institute) in June 2012,
    Laurent Hébert-Dufresne and three fellow attendees studied a competitive form of percolation (competition between site and bond percolation). Doing so they demonstrated that the order parameter could undergo a macroscopic jump,
    therefore answering a long-standing question as whether first-order phase transitions could occur on random networks. Congratulations are indeed in order.
       Their paper may be found here (APS website). This fruitful collaboration also yielded another paper that appeared in PLoS Comput. Biol. at the end of last year.

- date: 2012-12-20
  text: |-
    Denis Gagnon and Laurent Hébert-Dufresne have successfully completed their doctoral exams on the 5th and the 19th of Decembre respectively.
    Congratulations are in order.

- date: 2012-12-03
  text: 'Two emissaries (Antoine Allard and Laurent Hébert-Dufresne) have been sent south of the border to take part in the 2nd International Conference on Complex Sciences: Theory and Applications, December 5–7, 2012 Santa Fe, New Mexico. Their oral presentations are titled: _On the constrained growth of complex critical systems_ and _Unveiling hidden communities through cascading detection on network structures_. The archived manuscripts may be found from the Publications page.'

- date: 2012-11-12
  text: Our most recent contribution on photonic crystals and their use to generate arbitrary-profiled beams has appeared in J. Opt. Soc. Am. A shortly. The arXiv version as well as the full text version of the paper can be downloaded from the Publications page.

- date: 2012-09-25
  text: |-
    It is with great pride that we announce that Pierre-André Noël has successfully defended his thesis entitled "Dynamiques stochastiques sur réseaux complexes" (Stochastic Dynamics on Complex Networks), and has therefore been awarded the title of Philosophiae Doctor (Ph. D.).


     After careful study of his thesis, the four examiners have been unanimous in granting the highest overall mark–excellent in all counts. Dr. Noël's name will soon be added to the Tableau d’Honneur of the Faculté des Études Supérieures et Post-doctorales (Graduate School). The final version of his thesis will be available from the theses page in the very near future.


     Throughout his time in our group, Dr. Noël has been highly esteemed both at the personal and professional levels. Besides his talent and originality, his intellectual generosity has been one of his defining qualities. He has significantly contributed to the success of many projects, and to the training of his younger colleagues.


     Dr. Noël is now pursuing his research as a Postdoctoral Scholar in Prof.
    Raissa D'Souza's group at University of California, Davis.

- date: 2012-09-21
  text: Our new paper entitled "Bond percolation on a class of correlated and clustered random graphs" has been published in J. Phys. A. The full text (on the IOP website) and the associated arXiv are available from the publications page.

- date: 2012-09-17
  text: Pierre-André Noël will be defending his PhD thesis on September 24th in room POP-1168. Abstract of the presentation and other details may be found here.

- date: 2012-07-17
  text: Guillaume Painchaud-April has recently joined the R&D Team at Olympus NDT Canada situated in the Parc technologique near Québec City. Congratulations are in order. May he remain safe and sound outside of the “fold”.

- date: 2012-05-17
  text: Pierre-André Noël has been hired as a Postdoctoral Scholar in Prof. Raissa D'Souza's group at University of California, Davis. We wish him an interesting and productive time despite his physical distance from the Brotherhood...

- date: 2012-03-28
