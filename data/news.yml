- date: 2024-06-21
  text: |-
    The Dynamica Research Lab is proud to announce that the Network Science Society has awarded the prestigious [Erdős–Rényi Prize](https://netscisociety.net/award-prizes/er-prize) to [Antoine Allard](https://antoineallard.github.io/) for:

    > "The breadth and depth of his contributions to modeling complex systems as networks, including the geometry of networks and the role of heterogeneity and superspreading in contemporary diseases and complex contagions."

    The Erdős–Rényi Prize, awarded annually to a young scientist under 40, recognizes exceptional theoretical or experimental contributions that advance the interdisciplinary field of network science. The prize, which includes a $3,000 cash award and a personalized plaque, was presented to Antoine during a special session on the final day of [NetSci2024](https://netscis2024.com/en), where he also delivered a lecture titled *Simplicity meets complexity: Reproducing complex connectivity patterns with simple models*, presenting some of his recent research.

- date: 2024-06-20
  text: |-
    The Dynamica Research Lab showcased outstanding involvement in the **International School and Conference on Network Science**, the premier event in the field. This [year's edition](https://netsci2024.com/en) was co-organized by Antoine Allard and alumnus Laurent Hébert-Dufresne, with alumni Jean-Gabriel Young as Program Chair and Guillaume St-Onge as School & Satellite Chair. Additionally, Patrick Desrosiers and colleague Nicolas Doyon organized a focus session on Neuroscience.

    The entire lab actively attended the conference, along with many of our close collaborators. This strong participation was underscored by presentations from numerous members of the Dynamica Research Lab, including Ilhem Bouderbala, Benjamin Claveau, Antoine Légaré, Jérémi Lesage, Ariane Lizotte, Olivier Ribordy, François Thibault, Vincent Thibeault, and Zahra Yazdani. For more details, you can view the slides and posters [here](https://dynamicalab.github.io/publications.html#).

- date: 2024-02-14
  text: |-
    Dynamica's latest contribution, led by PhD candidate Vincent Thibeault, has been published in [Nature Physics](https://www.nature.com/articles/s41567-023-02303-0).
    Our work critically examines the often implicit use of low-rank matrices in modeling complex systems, such as biological neural networks, through linear algebra and random matrix theory. Such simplification is not only shown to be widespread across various fields of research, but it is also empirically put to the test for over 600 real-world networks, revealing their low effective dimensionality. We demonstrate that our observations significantly impact the understanding of nonlinear dynamics, enabling optimal dimension reduction and the emergence of higher-order interactions, and thereby providing deeper insights into the mechanisms underlying complex phenomena.

    Accompanying the publication, a [News & Views piece](https://www.nature.com/articles/s41567-023-02268-0) within the same issue of Nature Physics discusses the implications and significance of our findings. Further extending the reach of our research, a [news article on phys.org](https://phys.org/news/2024-01-validating-hypothesis-complex.html) and a [blog post by Manlio De Domenico](https://manlius.substack.com/p/complexity-thoughts-issue-25) have elaborated on the paper's themes and relevance to current scientific inquiries into complex systems. In recognition of this work, Vincent has been invited to present at the Mathematical Institute of Oxford University and Northeastern University's Network Science Institute (NetSI). Another notable achievement is the selection of the figure designed by Vincent and Myriam Thibeault for the front cover of the [latest issue of Nature Physics](https://www.nature.com/nphys/volumes/20/issues/2).

    For further details on this publication and access to the full text, please visit our [publication page](https://dynamicalab.github.io/publications.html).

