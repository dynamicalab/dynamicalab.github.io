- date: 2020-06-18
  text: |-
    While still under lockdown due the COVID-19 pandemic, the Dynamica Lab remains as active as ever!
    Indeed, the group recently posted two new preprints discussing the use of _Deep learning_ to access dynamical systems on networks and their applications:

    - [Detecting structural perturbations from time series with deep learning](https://arxiv.org/abs/2006.05232)
    - [Deep learning of stochastic contagion dynamics on complex networks](https://arxiv.org/abs/2006.05410)


    ##### Detecting structural perturbations from time series with deep learning

    Small perturbations in the structure of complex systems can lead to critical scenarios, from functional breakdowns in the brain to economic crises.
    Hence, our ability to prevent these situations is directly linked to our ability to detect these perturbations before the tipping point.
    To address this issue, this paper proposes a data-driven approach based deep learning to infer broken links directly from time series.
    As shown below, this extremely versatile tool is successfully applied to multiple cases, from epidemic spreading, to population and neural dynamics.
    The approach is proved highly effective in realistic settings involving noise in the time series and limited training data, while remaining computationally scalable to large systems.

    <img class="block-image" src="{{ "/assets/images/posts/2020-06-18-zoo2p0.png" }}">
    <caption>Accuracy of the detection of broken links for (A--C) epidemic spreading, (D--F) population dynamics and (G--I) neural dynamics.</caption>

    ##### Deep learning of stochastic contagion dynamics on complex networks

    Forecasting the propagation of infectious diseases is a complex problem, which is only partially addressed by simple mechanistic models.
    This paper presents a complementary and data-driven approach to modeling dynamics on networks using _graph neural networks_ (GNN), ranging from simple contagion, to complex and interacting contagion.
    It is shown that GNNs can be trained to effectively reproduce the inner mechanisms of contagion dynamics---that is, their transition probabilities---with surprising accuracy (see below).
    The paper also addresses the possibility to use GNNs to gain insights about the critical behaviors of contagion dynamics from data---some kind of numerical Petri dish.

    <img class="block-image" src="{{ "/assets/images/posts/2020-06-18-dynalearn.png" }}">
    <caption> Transition probabilities for (A) simple and (B) complex contagion dynamics as predicted by the GNN model. The predictions of the GNN are compared to the transitions probabilities as given by the process that generated the time series (GT, for ground truth) and the maximum likelihood estimators (MLE).</caption>

- date: 2020-05-25
  text: |-
    The current COVID-19 pandemic is locking everybody inside, but this does not
    mean putting a hold on science---on the contrary.
    The group recently posted a few preprints reminding us all of the importance of
    considering the network structure of social interactions, and its impact on the
    spread of diseases :

    - [Beyond R0: the importance of contact tracing when predicting epidemics](https://arxiv.org/abs/2002.04004)
    - [Master equation analysis of mesoscopic localization in contagion dynamics on higher-order networks](https://arxiv.org/abs/2004.10203)
    - [Social confinement and mesoscopic localization of epidemics on networks](https://arxiv.org/abs/2003.05924)
    - [The role of directionality, heterogeneity and correlations in epidemic risk and spread](https://arxiv.org/abs/2005.11283)


    ##### Beyond R0: the importance of contact tracing when predicting epidemics

    One key intuition from network science is that _heterogeneity_ makes a huge difference on the outcome of an epidemic.
    This paper reformulates classic results from percolation theory to emphasize the impact of the variability in the number of secondary cases produced by an infected individual.
    As seen below, using a network approach that accounts for heterogeneity provides much more reliable estimates for the final size of epidemics, compared to a standard SIR model.

    <img class="block-image" src="{{ "/assets/images/posts/2020-05-25-1.png" }}">

    ##### The role of directionality, heterogeneity and correlations in epidemic risk and spread

    Percolation approaches are rich and flexible, hence it is possible to investigate more complex interaction patterns than completely random contacts.
    One way is to consider correlations between the _in-degree_ and _out-degree_ of individuals : if someone is likely to catch a disease, is it also likely to spread it?
    Considering variations on this relationship can significantly change the outcome of an epidemic, as shown below.

    <img class="block-image" src="{{ "/assets/images/posts/2020-05-25-4.png" }}">


    ##### Master equation analysis of mesoscopic localization in contagion dynamics on higher-order networks

    Beyond the question _if_ a disease can spread, and to what extent, an important question is _where_.
    This paper provides a detailed analytical description of the phenomenon of _mesoscopic localization_, with an explicit characterization of the localization regimes.
    The use of clique-based approximate master equations gives a fine-grained description of the states of all cliques within the network, as shown below.
    In the localized regime, substructures of different sizes are effectively in a subcritical, critical and supercritical phases all at once.


    <img class="block-image" src="{{ "/assets/images/posts/2020-05-25-2.png" }}">

    ##### Social confinement and mesoscopic localization of epidemics on networks

    What are the key impacts of a localized epidemic? More specifically, how does this affect our _control_ over them?
    This paper investigate the consequences of a localized dynamics when performing _structural interventions_ on the structure, taking the form of removing cliques higher than a certain size.
    This is akin to forbidding events or gathering involving a certain number of people.

    It is found that for both the SIS model (analytically) and the SIR model (with simulations), there are increasing returns on the intervention for localized dynamics---the more you remove substructures, the more it is efficient.
    This behavior is very different from what we would expect in a well-mixed population, more similar to the delocalized dynamics.

    <img class="block-image" src="{{ "/assets/images/posts/2020-05-25-3.png" }}">

- date: 2020-02-19
  text: Patrick Desrosiers and Béatrice Désy presented their work on complex networks at the latest Pinte Sentinelle Nord event at the Rideau Rouge on February 19th.  Organized by [Sentinelle Nord Student Association](https://sentinellenord.ulaval.ca/en/communaute/association-etudiante-sentinelle-nord), this biannual science outreach activity is open to the public and aims to present the research of students and professors through a series of short presentations.  These social events also contribute to building a stronger community centered around Sentinelle Nord by allowing graduate students and postdocs, who may work in different departments and have very different backgrounds, to get to know one another, and to learn about each other’s research.

- date: 2020-02-03
  text: |-
    A new contribution from the collaboration between Dynamica and [Mariangeles Serrano](http://morfeo.ffn.ub.es/~mariangeles/) from the [Universitat de Barcelona](https://www.ub.edu/web/ub/en/) has just been published in __PLOS Computational Biology__.

    The paper titled [Navigable maps of structural brain networks across species](https://doi.org/10.1371/journal.pcbi.1007584) investigates the relationship between the structure of connectomes of different species and their spatial layout both in Euclidean and hyperbolic space. Among other things, it shows that hyperbolic maps offer a quantitative meaningful representation of connectomes, and that they provide a universal framework to study decentralized communication processes in connectomes of different species and at different scales on an equal footing.

- date: 2020-02-03
  text: |-
    Guillaume St-Onge was awarded a scholarship to pursue his ongoing internship at the
    [Vermont Complex Systems Center](https://vermontcomplexsystems.org). Financed by the [FRQ-NT](http://www.frqnt.gouv.qc.ca/bourses-et-subventions/consulter-les-programmes-remplir-une-demande/bourse/programme-de-stages-internationaux-tyq8kxxx1432653742744), the scholarship is awarded by [Calcul Québec](https://www.calculquebec.ca/nouvelle/obtenir-une-bourse-pour-un-stage-en-calcul-scientifique-a-letranger-cest-possible/) to research projects related to scientific computing.

    Congratulations are in orders!

- date: 2019-12-20
  text: |-
    The second edition of the [Complex Networks Winter Workshop (CNWW19)](https://sentinellenord.ulaval.ca/en/cnww-2019) was held at the [Monastère des Augustines](https://monastere.ca/) in Québec on December 15-20, 2019.

    Organized jointly by the [Vermont Complex Systems Center](http://www.vermontcomplexsystems.org/) (Juniper Lovato, Laurent Hébert-Dufresne), [Sentinelle Nord](https://sentinellenord.ulaval.ca/) (Marie-France Gévry) and Dynamica (Antoine Allard), CNWW is a week-long international school offering a unique opportunity for participants to engage in rigorous transdisciplinary complexity science research alongside some of the top researchers in the field of networks.

    Participants attended lectures on network science (e.g. community detection, dealing with network data, making high quality scientific figures) and on various topics leveraging the tools of network science (stability of ecosystems, on-line activism, sustainable forestry, animal behavior, etc) by leaders of the fields ([James P. Bagrow](https://bagrow.com/), [Dominique Gravel](http://ielab.recherche.usherbrooke.ca/), [Élise Filotas](http://elisefilotas.ca/en/home/), [Brooke Foucault Wells](http://brooke-welles.squarespace.com/), [Daniel B. Larremore](https://larremorelab.github.io/), [Elizabeth Hobson](http://hobsonresearch.com/), [Peter Sheridan Dodds](https://www.uvm.edu/pdodds/), [Samuel V. Scarpino](http://scarpino.github.io/)), as well as two lectures by [Vincent Larivière](https://crc.ebsi.umontreal.ca/) and [Cassidy R. Sugimoto](https://ella.sice.indiana.edu/~sugimoto/index.php) about the open-access publications and gender inequalities in science.

    Participants and lecturers also worked together on various original projects (hockey fights, social roles in ant colonies, spread of infectious diseases in coral reefs, etc.) and presented their results Friday afternoon. The objective of these projects was to force participants to step outside their comfort zone, and to expose them to a new intensive (and fun) way of doing science.

    This year again, the quality of the projects was outstanding.

    Social activites were scheduled on most nights, allowing participants and faculty to create bonds which will hopefully last well beyond the duration of the workshop.

    Dynamica's own Béatrice Désy and Vincent Thibeault were among the participants, and Guillaume St-Onge and Charles Murphy, who attended last year's edition of CNWW, returned as project liaisons.

- date: 2019-12-17
  text: |-
    The latest contribution of Dynamica has just been published in [Physical Review X](https://journals.aps.org/prx/).
    The project originates from a workshop in Charlevoix in September 2016, involving
    current Dynamica members (G. St-Onge, E. Laurence, C. Murphy, P. Desrosiers) and alumni, [Jean-Gabriel Young](http://www.jgyoung.ca/) and [Laurent Hébert-Dufresne](http://laurenthebertdufresne.github.io/).

    The paper titled [Phase Transition in the Recoverability of Network History](https://doi.org/10.1103/PhysRevX.9.041056) explores the very difficult *Network Archaeology* problem : reconstructing the past states of a growing network from a single static snapshot.
    Formulated as Bayesian inference task, a state-of-the-art sequential Monte Carlo method is developed to estimate the posterior distribution, used to identify and characterize a phase transition in the quality of the reconstructed history.

    Links to the full text and preprints are available on the [publication page](https://dynamicalab.github.io/publications.html).

- date: 2019-12-16
  text: |-
    The latest contribution from the long-standing collaboration between Dynamica and [Guillermo García-Pérez](https://scholar.google.es/citations?user=MibFSJIAAAAJ&hl=es), [Marián Boguñá](http://complex.ffn.ub.es/~mbogunya/) and [Mariangeles Serrano](http://morfeo.ffn.ub.es/~mariangeles/) from the [Universitat de Barcelona](https://www.ub.edu/web/ub/en/) has just been published in __New Journal of Physics__.

    The paper titled [Mercator: uncovering faithful hyperbolic embeddings of complex networks](https://doi.org/10.1088/1367-2630/ab57d2) proposes a new algorithm to embed real complex networks in hyperbolic space. The algorithm leverages several developments proposed in recent years and outperforms previous approaches in most tested cases.  Critically, the algorithm is designed to naturally unveil the community structure that may be encoded in the network structure.

    A C++ code as well as a Python package are available on [Github](https://github.com/networkgeometry/mercator). Links to the full text and preprints are available on the [publication page](/publications.html).

- date: 2019-10-11
  text: |-
    We had the great pleasure of having [Jean-Gabriel Young](http://www.jgyoung.ca) (U. Michigan) with us on October 11th. Apart from working on ongoing projects and brainstorming on future ones, Jean-Gabriel gave a lecture on the Bayesian inference of network structure from observational data.

    His latest preprint on the subject can be found [here](https://www.biorxiv.org/content/10.1101/754077v1).

- date: 2019-10-07
  text: |-
    [George T. Cantwell](https://www.george-cantwell.com/) (University of Michigan) will be among us from the 14th to the 18th of October and will give a talk to the group (and any other Network Science enthusiams). The presentation will be held Tuesday the 15th of October at 13h30.

    **Title : Mean-field theory and beyond in complex networks**

    **Abstract :**
    _Mean-field theory provides a simple and intuitive method for performing calculations in networks. It works particularly well for dense networks but usually fails for sparse ones.  To overcome this problem, "message passing" was developed, which is conceptually similar to mean-field theory but works well on sparse networks.  Unfortunately, most interesting real-world networks are neither wholly dense or sparse. Rather, they are sparse at large scales while dense locally.  As a result, conventional message passing ultimately fails to provide the required corrections in many cases._

    _In this talk I will outline a series of successive approximations of increasing sophistication.  At one end, we recover standard mean-field theory, while at the other we obtain a method that is exactly correct on all networks but too difficult to apply in practice. In between, however, we find approximations that significantly out perform standard methods while maintaining their efficiency._

- date: 2019-10-04
  text: |-
    Xavier Roy-Pomerleau presented his research project (oral + poster) on October 4th during the 8th edition of the Journée de la recherche en Sciences et Génie held at Université Laval. Organized by the Association des étudiants gradués en sciences et génie de l'Université Laval (Graduate Students Association), this event brings together students from the various scientific disciplines of the Faculté des sciences et génie so they can interact and exchange ideas with teachers and students from all levels.

    His poster presentation was judged the best of all presentations by master students that day.

    Congratulations are in order!

- date: 2019-09-30
  text: |-
    Charles Murphy successfully presented and defended his PhD seminar titled _Apprentissage profond de dynamiques sur réseaux complexes_ on September 30th.

    The PhD seminar normally occurs during the 7th semesters into the PhD. The event resembles the PhD defense in that the candidate presents their research in a 30-minute talk, and then answers questions from an evaluation committee. The committee was composed by [Simon V. Hardy](http://www2.ift.ulaval.ca/~hardy) from the [CERVO Brain Research Center](https://cervo.ulaval.ca), Louis J. Dubé and Antoine Allard.

    The committee judged Charles’s performance from very good to excellent.

    Congratulations Charles!

- date: 2019-09-18
  text: François Thibault, who worked with Charles Murphy and Antoine Allard as an intern last summer, presented on September 17th the research he pursued during his internship. The presentation was in front of his peers and is a prerequisite for the Sigma+ certification of his B.Sc. degree. Good work François, and we are proud that you decided to continue working with us during your M.Sc. starting in May 2020.

- date: 2019-09-09
  text: |-
    This September, one of our master students, Xavier Roy-Pomerleau, flew to England in order to attend to the first edition of the Workshop on Higher-order Interaction Networks: Dynamics, Structure, Data. This workshop was held at the Mathematical Institute of University of Oxford from September 9 to 11.

    He was accepted for a poster presentation in which he presented how one can infer higher-order co-occurrence patterns and simplicial complexes from presence/absence data.

    More information can be found on the <a href='https://www.maths.ox.ac.uk/groups/networks/events/higher-order-interaction-workshop'> conference's webpage</a>.

- date: 2019-09-03
  text: |-
    Béatrice Désy who joined the group in 2018 as a summer intern will be continuing her research with us as a master student co-supervised by Antoine Allard and Patrick Desrosiers.

    Her research will involve both the development of null models to detect significative ecological cooccurrences and the development of a new approach to generate weighted networks embedded in hyperbolic space.

- date: 2019-08-29
  text: |-
    The group attended the Sentinelle Nord 2019 Scientific Meeting that took place at the Lévis Convention Centre from August 26th to 28th.

    Members that submitted a talk, Edward Laurence & Xavier Roy-Pomerleau, and a poster, Mohamed Bahdine, were all accepted and their presentations were well received.

    Our senior member, Edward Laurence, presented a talk titled _Deciphering the time evolution of dynamical complex systems using deep learning models_. The content of this presentation was partly developed during the second edition of the Dynamica workshop retreat (a.k.a Rezoo) that was sponsored by Sentinelle Nord.

    Xavier Roy-Pomerleau presented the method he developed during his master’s degree on the detection of higher-order co-occurrence patterns that can be applied to various presence/absence datasets.

    Mohamed Bahdine’s poster topic was the use of deep learning to extract functional connectomes from time series.

    Abstracts of the conference can be found on the <a href='https://sentinellenord.ulaval.ca/en/scientific-meeting-2019'> Scientific Meeting’s webpage</a>.

- date: 2019-08-28
  text: |-
    The Sentinelle Nord Research Chair on Applications and Theory of Network Analysis held by Antoine Allard has officially been inaugurated on August 28th during the [3rd annual meeting](https://sentinellenord.ulaval.ca/en/scientific-meeting-2019) of the [Sentinelle Nord](https://sentinellenord.ulaval.ca/en) initiative.

    Alongside two other holders of Sentinelle Nord Research Chairs, [Maripier Isabelle](http://www.mpisabelle.com/) and [Pierre Legagneux](https://www.bio.ulaval.ca/departement-et-professeurs/professeurs-et-personnel/professeurs/fiche/show/legagneux-pierre/), Antoine Allard presented his new research chair in front of several dignitaries and partners of Université Laval, and outlined the next four years of research financially supported by the means granted to the Chair. Exciting times ahead!

- date: 2019-08-26
  text: |-
    From 18th to the 23rd of August, two group members had the chance to participate in Université de Sherbrooke's 2019 Summer School in Biodiversity Modelling that took place in beautiful Mount Orford, Québec. Béatrice Désy and Xavier Roy-Pomerleau, whose projects involve modelling of ecological cooccurrence and higher-order patterns, were chosen for this intense, diverse and interesting course. Béatrice and Xavier gained and brought back new insights on ecological modelling that shall complement their research, well done!

    More info on the <a href='https://www.usherbrooke.ca/sciences-ete/fr/ecoles-dete-anterieures/modelisation-de-la-biodiversite-2019/accueil-modelisation-de-la-biodiversite/'>Summer School's webpage</a>.

- date: 2019-08-08
  text: |-
    The latest contribution to come out of the long-standing collaboration between [Laurent Hébert-Dufresne](http://laurenthebertdufresne.github.io/) and Antoine Allard has just been published in [Physical Review Research](https://journals.aps.org/prresearch/).

    The paper entitled [Smeared phase transitions in percolation on real complex networks](https://doi.org/10.1103/PhysRevResearch.1.013009) leverages the concept of _local order parameter_ to explore the way through which the largest connected component emerges in real complex networks. Among other things, it is shown how insights obtained from random graph models cannot always be directly used to study percolation transitions in networks with realistic complex structure.

    Links to the full text and preprints are available on the [publication page](https://dynamicalab.github.io/publications.html).

- date: 2019-06-17
  text: |-
    The three talks for the main conference were well received : Deep learning for dynamical processes on networks (C. Murphy), prediction of synchronization regimes using dimension reduction on graphs (V. Thibeault) and prediction of localization regimes for spreading processes on networks (G. St-Onge).


     The conference was a big success, thanks to the Lead Conference Organizer Juniper Lovato and to two Dynamica alumni : Laurent Hébert-Dufresne (Co-Chair for the main conference) and Antoine Allard (Schools Co-Chair).

    Abstracts for the presentations are available on the [publication page](/publications.html).

- date: 2019-06-17
  text: |-
    The latest contribution of the network section is available in the July issue of Computer Physics Communication.


     The paper entitled [Efficient sampling of spreading processes on complex networks using a composition and rejection algorithm](https://doi.org/10.1016/j.cpc.2019.02.008) propose an efficient simulation scheme for simple contagion models on networks, represented by a discrete-state and continuous time Markov process. The method hinges on a clever composition and rejection step that allows the efficient sampling of heterogeneous (and time-varying) probability distributions.


     Links to the full text and preprints are available on the [publication page](/publications.html).

- date: 2019-06-17
  text: |-
    Dynamica held 3 (!) end of winter semester Colloquia on April 12th.

     Vincent Thibeault presented his plan for his master thesis, in a talk entitled
    "Prédiction des régimes de synchronisation sur graphes aléatoires" (Predicting synchronization regimes on random graphs); Xavier Roy-Pomerleau did the same.
    His presentation was titled "Inférence d’interactions d’ordre supérieur dans les systèmes complexes" (Inference of higher order interactions in complex systems).


     On this occasion, Guillaume St-Onge also passed his doctoral entry exam. An important part of the evaluation was a presentation, titled "Theoretical and computational modeling of spreading processes on complex networks".


     The three of them passed their respective tests with excellent grades, and are now free to undertake the next step; for VT and XRP, this will mean writing their M.Sc thesis, while GST can officially begin the active research portion of his PhD.


     Best of luck to them!

- date: 2019-05-10
  text: |-
    Francis Normand from the [DCClab at CERVO](http://www.dcclab.ca) joined the group as a master student co-supervised by Antoine Allard.

    His research project will involve the development of network comparison techniques to investigate how the microbiome affects the early development of the zebrafish brain.

- date: 2019-05-03
  text: |-
    The 13th edition of the Symposium Dynamica took place at the [Forêt Montmorency](https://www.foretmontmorency.ca/en/) on May 2nd and 3rd.

    This symposium is the final evaluation of the course _Dynamique non linéaire, chaos et complexité_ created and taught by Louis J. Dubé for many years, and now taught by Antoine Allard. The material covered is heavily based on Steven H. Strogatz [_Nonlinear Dynamics and Chaos: With Applications to Physics, Biology, Chemistry, and Engineering_](http://www.stevenstrogatz.com/books/nonlinear-dynamics-and-chaos-with-applications-to-physics-biology-chemistry-and-engineering).

    What makes this course a unique experience for the students is the symposium during which they present the results of the research they pursued during the semester on a topic of their choice related to nonlinear dynamics. For most of the students, the symposium consists in their first experience in doing a scientific communication with a profesional decorum.

- date: 2019-03-11
  text: |-
    The latest contribution of the network section is available in the March issue of Physical Review X.

    The paper entitled [Spectral Dimension Reduction of Complex Dynamical Networks](https://doi.org/10.1103/PhysRevX.9.011042) presents a mathematically sound formalism to coarse grain the high dimensional set of equations governing the evolution of a general deterministic dynamics on a network. The approach leverage the spectral properties of a network, more specifically the dominant eigenvalues and eigenvectors of the adjacency matrix, to perform the reduction. The lower dimensional system can be used to better understand the critical behavior of certain systems and lead the way towards a better comprehension of the robustness and the resilience of complex systems.

    Links to the full text and preprints are available on the [publication page](/publications.html).

- date: 2019-02-28
  text: |-
    Dynamica performs a hat trick : three members of the network division will attend and give talks during the main conference at NetSci 2019. This 14th edition will be held in Burlington, Vermont, at the end of May.


     The presentations will cover diverse topics : the (deep) learning of dynamical processes on complex networks (C. Murphy), the characterization of localization on networks for spreading processes (G. St-Onge) and the prediction of synchronization regimes using dimension reduction on graphs (V.
    Thibeault). Details are available on the conference page.


     Beyond this formidable representation of the current members of the group,
    alumni from Dynamica will be particularly active during this annual meeting on network science. Laurent Hébert-Dufresne, now assistant professor in the department of computer science at the University of Vermont, will be Co-Chair for the main conference. Jean-Gabriel Young, James S. McDonnell Fellow at the University of Michigan, will be Co-Chair at the Open NetSci Hackathon, the weekend before the main event.

    Abstracts for the presentations are available on the [publication page](/publications.html).

- date: 2019-02-27
  text: |-
