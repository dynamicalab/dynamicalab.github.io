    \[Alumni update\] [Laurent Hébert-Dufresne](https://laurenthebertdufresne.github.io) was awarded the [2026 Erdős–Rényi Prize by the Network Science Society](https://netscisociety.net/award-prizes/er-prize) for *foundational contributions to the theory of contagion on complex networks, illuminating how network structure, higher-order interactions, and nonlinear transmission mechanisms shape the spread of diseases, behaviors, and ideas.*

    The Erdős–Rényi Prize is *awarded each year to a selected young scientist (under 40 years old on the day of the nomination deadline) for their research achievements in the area of network science, broadly construed. While the achievements can be both theoretical and experimental, the prize is aimed at emphasizing outstanding contributions relevant to the interdisciplinary progress of network science.* (from the NSS website)

