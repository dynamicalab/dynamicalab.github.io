- date: 2021-03-01
  text: |-
    The latest contribution of Dynamica has just been published in [Physical Review Letters](https://journals.aps.org/prl/) alongside its companion paper in [Physical Review E](https://journals.aps.org/pre/), entitled [Social Confinement and Mesoscopic Localization of Epidemics on Networks](https://doi.org/10.1103/PhysRevLett.126.098301) and [Master equation analysis of mesoscopic localization in contagion dynamics on higher-order networks](https://doi.org/10.1103/PhysRevE.103.032301) respectively.

    These articles provide a theoretical characterization of **mesoscopic localization**, the localization of a dynamics in certain groups, in the context of contagions on networks.
    The letter, furthermore, investigates the impact of localized epidemics on structural interventions, where groups above a certain size are removed, akin to forbidding events or gathering involving a certain number of people.
    This lays the foundation for a better comprehension of the impact of nonpharmaceutical interventions, ultimately helping us *control* epidemics.

    Links to the full text and preprints are available on the [publication page](https://dynamicalab.github.io/publications.html).

- date: 2021-01-26
  text: |-
    Growth processes allow us to better understand many of the complex properties of networks, which are by nature dynamic objects.
    We can go further and assume a certain growth model did generate the structure, allowing us to perform Bayesian inference on the past states of the network.
    As it has been shown in a [previous study](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.9.041056) from Dynamica, _temporal reconstruction_ is, however, a very difficult task.

    The paper entitled [Inference, Model Selection, and the Combinatorics of Growing Trees](https://doi.org/10.1103/PhysRevLett.126.038301), introduces a glimpse of hope for rigorous temporal reconstruction of networks. In this project, led by [George T. Cantwell](https://www.george-cantwell.com/), current Dynamica member [Guillaume St-Onge](https://gstonge.github.io/), and alumni [Jean-Gabriel Young](http://www.jgyoung.ca/), the authors derive exact and efficient inference methods for growing trees and demonstrate them in a series of applications: network interpolation, history reconstruction, model fitting, and model selection.

    Links to the full text and preprints are available on the [publication page](https://dynamicalab.github.io/publications.html).

- date: 2020-12-03
  text: |-
    Jean-Luc Déziel has successfully defended his thesis work on the 23rd of Novembre  (see the Abstract [here](/assets/pdf/affiches/2020-11-23-jean-luc-soutenance.pdf)) and has been highly praised for his dedication and originality in completing his research on ''Formation et auto-organisation de plasma induit par impulsions laser intenses dans un milieu diélectrique'' (*Plasma formation and self-organisation in a dielectric medium induced by short intense laser pulses*). The team of examiners was composed of Louis J. Dubé (dir., Physics, U. Laval), Charles Varin (co-dir. Physics, Cégep de l’Outaouais, Gatineau (Québec), Michel Piché (Physics, U. Laval), Younès Messaddeq (Physics, U. Laval)], and François Vidal (Plasma Physics, INRS) who served as external referee.

    Jean-Luc is the last member of the Photonics branch of Dynamica. He is to be congratulated for bringing his studies to completion despite the competing demands of his full time occupation as a research scientist at [LeddarTech](https://leddartech.com/), a company involved in sensor technologies whose goal is to enable *autonomous driving* through environmental sensing.  His present occupations are to conceive and train artificial neural networks to safely reach the designated goal. A loss for us, a win for AI ...

    The final version of the thesis is available [here](/assets/pdf/theses/deziel2020_thesis.pdf).

- date: 2020-11-11
  text: |-
    The latest contribution of Dynamica has just been published in [Physical Review Research](https://journals.aps.org/prresearch/).

    The paper entitled [Threefold way to the dimension reduction of dynamics on networks: An application to synchronization](https://journals.aps.org/prresearch/abstract/10.1103/PhysRevResearch.2.043215) addresses a difficult  problem: predicting the impact of network topology and dynamics on the evolution of the states of complex systems and, especially, on the emergence of collective phenomena, such as synchronization. A new method of *Dimension Reduction*, called DART, is developed to map high-dimensional dynamics unto low-dimensional ones while preserving the most salient features, both topological and dynamical, of the original system. The authors identify *three major reduction procedures* whose relative accuracy depends on whether the evolution of the states is mainly determined by the intrinsic dynamical parameters *W*, the degree sequence *K*, or the adjacency matrix *A*. DART is successfully used, for instance, to predict the synchronization curves for three phase dynamics (Winfree, Kuramoto, theta) on networks with heterogeneous and modular structures.


    Links to the full text and preprint are available on the [publication page](https://dynamicalab.github.io/publications.html).

- date: 2020-10-29
  text: |-
    Vincent Thibeault has completed the requirements for his M.Sc. degree in physics.  His Master’s thesis entitled *Réduire la dimension des systèmes complexes: un regard sur l’émergence de la synchronisation* has been unanimously praised by the examiners [Louis J. Dubé (dir., Physics), Patrick Desrosiers (co-dir. Physics), Antoine Allard (Physics), Nicolas Doyon (Mathematics)] who have given the highest possible mark (excellent). Consequently, his name will be added to the [Board of Honor of the Faculty of Graduate and Postdoctoral Studies](https://www.fesp.ulaval.ca/faculte/tableau-honneur).  The final version of the thesis is available [here](/assets/pdf/theses/Thibeault20_master.pdf). Congratulations Vincent!

    Congratulations are also in order for Pr. Dubé. Indeed, Vincent is Pr. Dubé’s tenth student in twelve years to be honored by the Faculty of Graduate and Postdoctoral Studies.  The current members of Dynamica will do their best to perpetuate this remarkable tradition of excellence.

- date: 2020-09-01
  text: |-
    We are proud to announce that Xavier Roy-Pomerleau has successfully completed his M.Sc. degree in physics.  His impressive master’s thesis entitled "Inférence d'interactions d'ordre supérieur et de complexes simpliciaux à partir de données de présence/absence" (Inferring higher-order interactions and simplicial complexes from presence/absence data) has received very positive reviews from all the examiners: Louis J. Dubé (dir., Physics), Patrick Desrosiers (co-dir. Physics), Antoine Allard (Physics), Jérôme Comte (INRS - Eau Terre Environnement).  The final version of the thesis is available [here](/assets/pdf/theses/Roy-Pomerleau20_master.pdf).

