- date: 2011-05-01
  text: |-
    We will be attending the 2011 edition of the International School and Conference on Network Science (NetSci 2011). Vincent Marceau, Laurent Hébert-
    Dufresne and Pierre-André Noël will be presenting their latest results via two oral presentations and a poster presentation, respectively. Netsci 2011 will be help from June 6th to June 10th in Budapest, Hungary.

- date: 2011-03-30
  text: |-
    We will be attending the 2011 edition of the International Workshop on Microcavities and their Applications (WOMA 2011). Denis Gagnon and Louis J.
    Dubé will be presenting the latest results of the group via a poster presentation and a oral presentation, respectively. WOMA 2011 will be help from May 24th to May 27th in Pusan, South Korea.

