  text: Our new paper in Physical Review E has been published. The full text (on the APS website) and the associated arXiv are available from the publications page.

- date: 2012-03-01
  text: |-
    Laurent Hébert-Dufresne has been selected to attend the 2012 edition of the Complex Systems Summer School organized by the Santa Fe Institute. The summer school will be held in Santa Fe, NM from June 4 to June 29. Congratulations are in order. Here is an excerpt from the letter of acceptance highlighting the importance of the honour bestowed upon another member of the group (after Antoine Allard in 2011) :

    " ...Out of more than 300 students (about 6 applicants for each seat) you have been selected based on your academic credentials, eclectic research agenda,
    and evidence of transdisciplinary interests. Selected participants come from all over the world and represent a wide range of disciplines.
       The Institute’s Complex Systems Summer School is our flagship educational program, now nearly twenty-five years old. Many of our alumni tell us that participation in the School has had a major, sustained impact on their academic and professional careers, including membership in a research network of outstanding collaborators at the cutting edge of science."

- date: 2012-02-29
  text: Our new paper in Physical Review E has been published. The full text (on the APS website) and the associated arXiv are available from the publications page.

- date: 2011-11-14
  text: |-
    The world-renowned biosensor par excellence Dr. Vollmer will be presenting 2
    talks in the Physics Department: a general public Colloquium (15 Nov.) entitled "Resonator-based Biosensing and Light Localization" as well as a more technical Seminar (16 Nov.) on "Microcavity Biosensors: Application of a label-free microsystem biodetection technology". More details can be found here.
       He will also take the opportunity to discuss new projects with the Photonics section of Dynamica and meet a number of colleagues interested in biosensing in the greater Québec area. He will end his trip on the 18th of Novembre with a visit to our Montréal collaborators at Ecole Polytechnique and McGill.

- date: 2011-11-13
  text: Following in the footsteps of Antoine Allard who received the no-less prestigious Frederick Banting and Charles Best Canada Doctoral Scholarship from the Canadian Institutes of Health Research (CIHR) in 2008, Laurent Hébert-Dufresne has recently been informed by NSERC of its intention to upgrade his doctoral support to the level of the Alexander Graham Bell scholarship. We bow to the wisdom of NSERC for this most judicious and well deserved decision.

- date: 2011-10-13
  text: |-
    It is with great pride that we have learned that Laurent Hébert-Dufresne's Master thesis has received the highest overall mark (excellent) by its three examiners. The thesis will be added to the Tableau d’Honneur of the Faculté
    des Etudes Supérieures et Post-doctorales (Graduate School).

- date: 2011-10-13
  text: |-
    Our recent publication in _Physical Review Letters_ is the subject of an article in _Au fil des événements_ , Université Laval's community newspaper.
    The article can be found here.

- date: 2011-09-30
  text: |-
